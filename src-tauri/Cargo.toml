[package]
name = "ghostrank"
version = "0.0.0"
description = "Ghostrank desktop shell"
edition = "2021"

[lib]
name = "ghostrank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
