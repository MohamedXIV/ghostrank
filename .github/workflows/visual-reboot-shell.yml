name: Visual Reboot V1 — Five Real Distros
on:
  pull_request:
    paths:
      - 'src/components/game/desktop/**'
      - 'src/components/game/computer-desktop.tsx'
      - 'src/presentation/shell-layout*'
      - 'public/visual-reboot/**'
      - 'scripts/browser-smoke/visual-reboot-shell-smoke.mjs'
      - '.github/workflows/visual-reboot-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-visual:
    name: Real desktop/phone distro shell acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Build export
        run: npm run build
      - name: Capture five distros / three views / two screen sizes
        run: node scripts/browser-smoke/visual-reboot-shell-smoke.mjs
      - name: Preserve images and report for human visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghostrank-v1-shell-screenshots
          path: .smoke/visual-reboot/shell-v1/
          if-no-files-found: error
