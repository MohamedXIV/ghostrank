name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web and simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static application
        run: npm run build

  desktop:
    name: Tauri desktop
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget \
            xauth \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
      - name: Test locked Tauri crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri desktop
        run: npm run desktop:build -- --debug --no-bundle
      - name: Verify lockfiles did not drift
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Launch desktop smoke
        run: |
          set +e
          timeout 8s dbus-run-session -- xvfb-run -a env \
            GDK_BACKEND=x11 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            ./src-tauri/target/debug/ghostrank
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Ghostrank desktop exited unexpectedly with code $code"
            exit 1
          fi
