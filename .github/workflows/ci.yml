name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web and simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Emit npm lock for foundation bootstrap
        run: |
          echo "__PACKAGE_LOCK_BEGIN__"
          base64 package-lock.json
          echo "__PACKAGE_LOCK_END__"
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  rust:
    name: Tauri Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Emit Cargo lock for foundation bootstrap
        if: always()
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            echo "__CARGO_LOCK_BEGIN__"
            base64 src-tauri/Cargo.lock
            echo "__CARGO_LOCK_END__"
          fi
