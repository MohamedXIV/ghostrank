name: Visual Reboot Before/After Evidence
on:
  pull_request:
    paths:
      - 'scripts/browser-smoke/visual-reboot-baseline.mjs'
      - '.github/workflows/visual-reboot-baseline.yml'
      - 'src/components/game/**'
      - 'src/app/globals.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Capture actual Shell, Recon and Market in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Build game static export
        run: npm run build
      - name: Capture original UI before reboot
        run: node scripts/browser-smoke/visual-reboot-baseline.mjs
      - name: Upload actual browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-reboot-original-ui
          path: .smoke/visual-reboot/before/
          if-no-files-found: error
